[project]
name = "s4ever"
version = "0.1.0"
description = "S4 and S4D state space models with fused TileLang/Metal kernels"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "jzluo", email = "20971593+jzluo@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["s4", "s4d", "state space models", "ssm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cuda-pathfinder>=1.6; sys_platform == 'linux'",  # finds the CUDA and CCCL headers for NVRTC
    "cuda-toolkit[cccl]; sys_platform == 'linux'",
    "numpy",
    "tilelang>=0.1.15,<0.1.16; sys_platform == 'linux'",
    "torch>=2.13.0; sys_platform != 'darwin'",
    "torch>=2.15.0; sys_platform == 'darwin'",  # pytorch/pytorch#199642
]

[project.urls]
Repository = "https://github.com/jzluo/s4ever"
Issues = "https://github.com/jzluo/s4ever/issues"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-third-party = ["tilelang"]

[tool.pyrefly]
project-includes = ["src"]
# TileLang's DSL puts calls in annotations
project-excludes = ["src/s4ever/_backends/tilelang/kernels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# compile kernels in parallel
addopts = ["-n", "8", "--dist", "worksteal"]
filterwarnings = [
    "ignore:Failing to pass a value to the 'type_params':DeprecationWarning",
    "error:s4ever. the ops use PyTorch",
]
